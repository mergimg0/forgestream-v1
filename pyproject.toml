[project]
name = "forgestream"
version = "0.1.0"
description = "Live meeting intelligence with SOS-governed agent swarms"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
emotion = [
    "opensmile>=2.5",
    "praat-parselmouth>=0.4",
    "numpy>=1.26",
]
diarization = [
    "pyannote.audio>=3.1",
    "torch>=2.0",
    "torchaudio>=2.0",
]
emotion-ml = [
    "forgestream[emotion]",
    "funasr>=1.2",
    "torch>=2.0",
]
gemini = [
    "google-genai>=1.0",
]
tui = [
    "textual>=0.80",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
all = [
    "forgestream[dev,gemini,tui,dashboard,emotion]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
